<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#2D46B9">
    <title>GUARDIÃ PRO - GPS</title>
    
    <style>
        :root {
            --azul: #2D46B9;
            --amarelo: #E9C143;
            --verde-wa: #25D366; /* COR DO WHATSAPP */
            --verde-maps: #34a853;
            --bg: #f2f2f7; 
            --card: #ffffff; 
            --texto: #1c1c1e;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; text-transform: uppercase; }

        body { 
            background-color: var(--bg) !important; 
            margin: 0; 
            color: var(--texto);
            font-family: -apple-system, system-ui, sans-serif; 
            padding-top: calc(var(--safe-top) + 185px); 
            padding-bottom: calc(var(--safe-bottom) + 20px);
        }

        header { 
            background: rgba(242, 242, 247, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding-top: var(--safe-top);
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center;
        }

        .logo-container { padding: 10px 0 2px; }
        .logo-img { height: 50px; width: auto; }

        .search-area { padding: 5px 15px; width: 100%; max-width: 600px; display: flex; gap: 8px; }
        .input-wrapper { position: relative; flex-grow: 1; }
        #searchBar {
            width: 100%; padding: 12px 35px 12px 15px; border-radius: 12px;
            border: none; background: rgba(0, 0, 0, 0.06); font-size: 14px; color: #000; outline: none;
            font-weight: 700;
        }
        
        #clearSearch {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: #8e8e93; color: white; border: none; width: 20px; height: 20px;
            border-radius: 50%; font-size: 10px; display: none; cursor: pointer;
        }

        .btn-near {
            background: var(--azul); color: white; border: none; padding: 0 12px;
            border-radius: 12px; font-size: 18px; cursor: pointer;
        }

        .categories {
            display: flex; overflow-x: auto; padding: 10px 15px 12px; gap: 8px;
            scrollbar-width: none; width: 100%; max-width: 600px;
        }
        .categories::-webkit-scrollbar { display: none; }
        .pill {
            padding: 8px 16px; border-radius: 20px; background: white;
            border: 1px solid #ddd; color: var(--azul); font-size: 11px; font-weight: 800;
            white-space: nowrap; flex-shrink: 0;
        }
        .pill.active { background: var(--azul); color: white; border-color: var(--azul); }

        .grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 12px; padding: 0 15px; max-width: 1200px; margin: 0 auto;
        }

        .skeleton { height: 105px; background: #e5e5ea; border-radius: 16px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        .btn {
            min-height: 105px;
            background: #ffffff; border: none; border-radius: 18px; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 10px 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.1s; cursor: pointer;
        }

        .btn-num { font-size: 26px; font-weight: 900; color: var(--azul); margin-bottom: 4px; }
        .btn-loc {
            font-size: 8px; font-weight: 800; color: #48484a;
            text-align: center; line-height: 1.2;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
            padding: 0 4px;
        }

        .btn:active { transform: scale(0.94); background-color: #e5e5ea; }

        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 2000; align-items: flex-end; justify-content: center;
        }
        .modal-box {
            background: white; width: 100%; max-width: 500px; 
            padding: 20px 20px calc(25px + env(safe-area-inset-bottom));
            border-radius: 25px 25px 0 0; text-align: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2); animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        #modal-cat-tag { font-size: 10px; font-weight: 800; background: #f2f2f7; color: var(--azul); padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 12px; letter-spacing: 1px; }
        #modal-text { font-size: 18px; font-weight: 900; margin-bottom: 25px; line-height: 1.4; color: #000; }
        
        .action-buttons { display: flex; flex-direction: column; gap: 10px; }
        .m-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px; border-radius: 14px; border: none; font-weight: 800; font-size: 14px; color: white;
            text-decoration: none;
        }
        .btn-maps { background: var(--verde-maps); }
        .btn-wa { background: var(--verde-wa); }
        .btn-close { background: transparent; color: #8e8e93; margin-top: 5px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="logo-container"><img src="logo.png" alt="GUARDIÃ" class="logo-img"></div>
    <div class="search-area">
        <button class="btn-near" onclick="findNearest()" title="MAIS PRÓXIMAS">📍</button>
        <div class="input-wrapper">
            <input type="text" id="searchBar" placeholder="Nº OU RUA..." onkeyup="handleSearch()">
            <button id="clearSearch" onclick="clearSearchBar()">✕</button>
        </div>
    </div>
    <div class="categories">
        <button class="pill active" onclick="filtrarCat('TUDO', this)">TUDO</button>
        <button class="pill" onclick="filtrarCat('CENTRO', this)">CENTRO</button>
        <button class="pill" onclick="filtrarCat('BAIRRO', this)">BAIRROS</button>
        <button class="pill" onclick="filtrarCat('TREVO', this)">TREVOS</button>
        <button class="pill" onclick="filtrarCat('SAÍDA', this)">SAÍDAS</button>
    </div>
</header>

<div class="grid" id="mainGrid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</div>

<div id="modal" onclick="fechar()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="width: 40px; height: 5px; background: #e5e5ea; border-radius: 5px; margin: 0 auto 15px;"></div>
        <div id="modal-cat-tag"></div>
        <div id="modal-text"></div>
        <div class="action-buttons">
            <a id="maps-link" class="m-btn btn-maps" target="_blank">📍 ABRIR NO GOOGLE MAPS</a>
            <button id="wa-btn" class="m-btn btn-wa" onclick="shareAction()">💬 ENVIAR PELO WHATSAPP</button>
            <button class="m-btn btn-close" onclick="fechar()">FECHAR</button>
        </div>
    </div>
</div>

    let activeId = null;

    function render() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        Object.keys(cameras).sort((a,b) => parseFloat(a)-parseFloat(b)).forEach(id => {
            const cam = cameras[id];
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.dataset.cat = cam.c;
            btn.dataset.loc = cam.l;
            btn.dataset.apelido = cam.a;
            btn.onclick = () => ver(id);
            btn.innerHTML = `<span class="btn-num">${id}</span><span class="btn-loc">${cam.a}</span>`;
            grid.appendChild(btn);
        });
    }

    function ver(id) {
        activeId = id;
        const cam = cameras[id];
        document.getElementById('modal-text').innerText = `POSTE ${id}: ${cam.l}`;
        document.getElementById('modal-cat-tag').innerText = cam.c;
        document.getElementById('maps-link').href = `https://www.google.com/maps/search/?api=1&query=${cam.g}`;
        document.getElementById('modal').style.display = "flex";
        if(navigator.vibrate) navigator.vibrate(50);
    }

    function fechar() { document.getElementById('modal').style.display = "none"; }

    function handleSearch() {
        const t = document.getElementById('searchBar').value.toUpperCase();
        document.getElementById('clearSearch').style.display = t ? 'block' : 'none';
        document.querySelectorAll('.btn').forEach(b => {
            const match = b.dataset.loc.toUpperCase().includes(t) || b.dataset.apelido.toUpperCase().includes(t) || b.querySelector('.btn-num').innerText.includes(t);
            b.classList.toggle('hidden', !match);
        });
    }

    function clearSearchBar() {
        document.getElementById('searchBar').value = '';
        handleSearch();
    }

    function filtrarCat(cat, el) {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        document.querySelectorAll('.btn').forEach(b => {
            b.classList.toggle('hidden', cat !== 'TUDO' && b.dataset.cat !== cat);
        });
    }

    // NOVA FUNÇÃO DE WHATSAPP
    function shareAction() {
        const cam = cameras[activeId];
        const linkMaps = `https://www.google.com/maps/search/?api=1&query=${cam.g}`;
        const mensagem = `POSTE ${activeId}: ${cam.l}\n\n📍 LOCALIZAÇÃO: ${linkMaps}`;
        
        const urlWa = `https://wa.me/?text=${encodeURIComponent(mensagem)}`;
        window.open(urlWa, '_blank');
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2-lat1) * Math.PI / 180;
        const dLon = (lon2-lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function findNearest() {
        navigator.geolocation.getCurrentPosition(pos => {
            const uLat = pos.coords.latitude;
            const uLon = pos.coords.longitude;
            const sorted = Object.keys(cameras).map(id => {
                const [cLat, cLon] = cameras[id].g.split(',').map(Number);
                return { id, dist: getDistance(uLat, uLon, cLat, cLon) };
            }).sort((a,b) => a.dist - b.dist);
            
            const grid = document.getElementById('mainGrid');
            const btns = Array.from(grid.children);
            btns.forEach(b => b.remove());
            sorted.forEach(item => {
                const originalBtn = btns.find(b => b.querySelector('.btn-num').innerText == item.id);
                if(originalBtn) grid.appendChild(originalBtn);
            });
            alert("LISTA REORDENADA PELAS MAIS PRÓXIMAS!");
        }, () => alert("ERRO AO OBTER LOCALIZAÇÃO."));
    }

    setTimeout(render, 500); 
</script>
