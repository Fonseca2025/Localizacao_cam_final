<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>GUARDIÃ PRO - OPERACIONAL</title>
    
    <!-- Leaflet Maps CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --azul: #2D46B9;
            --amarelo: #E9C143;
            --verde-wa: #25D366; 
            --verde-maps: #34a853;
            --waze-blue: #33ccff;
            --street-view: #4285F4;
            --bg: #f2f2f7; 
            --card-urbano: #ffffff;
            --card-rural: #FFFBEB;
            --texto: #1c1c1e;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; text-transform: uppercase; }

        body { 
            background-color: var(--bg) !important; 
            margin: 0; 
            color: var(--texto);
            font-family: -apple-system, system-ui, sans-serif; 
            padding-top: calc(var(--safe-top) + 185px); 
            padding-bottom: calc(var(--safe-bottom) + 70px);
        }

        header { 
            background: rgba(242, 242, 247, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding-top: var(--safe-top);
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center;
        }

        .logo-container { padding: 10px 0 2px; }
        .logo-img { height: 50px; width: auto; }

        .search-area { padding: 5px 15px; width: 100%; max-width: 600px; display: flex; gap: 8px; }
        #searchBar {
            flex-grow: 1; padding: 12px; border-radius: 12px;
            border: none; background: rgba(0, 0, 0, 0.06); font-size: 14px; outline: none;
            font-weight: 700;
        }

        .categories {
            display: flex; overflow-x: auto; padding: 10px 15px 12px; gap: 8px;
            scrollbar-width: none; width: 100%; max-width: 600px;
        }
        .categories::-webkit-scrollbar { display: none; }
        .pill {
            padding: 8px 16px; border-radius: 20px; background: white;
            border: 1px solid #ddd; color: var(--azul); font-size: 11px; font-weight: 800;
            white-space: nowrap;
        }
        .pill.active { background: var(--azul); color: white; border-color: var(--azul); }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 12px; padding: 0 15px; max-width: 1200px; margin: 0 auto;
        }

        .btn {
            min-height: 105px; border-radius: 18px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.1s; cursor: pointer; border: none;
        }
        .btn-urbano { background: var(--card-urbano); }
        .btn-rural { background: var(--card-rural); border: 1px solid #E9D8A6; }

        .btn-num { font-size: 26px; font-weight: 900; color: var(--azul); margin-bottom: 4px; }
        .btn-loc { font-size: 8px; font-weight: 800; color: #48484a; text-align: center; line-height: 1.2; padding: 0 4px; }
        .btn-group-tag { font-size: 7px; background: var(--amarelo); color: var(--azul); padding: 2px 6px; border-radius: 4px; margin-top: 4px; font-weight: 900; }

        .btn:active { transform: scale(0.94); opacity: 0.8; }

        #map-container {
            display: none; position: fixed; top: calc(var(--safe-top) + 185px); bottom: calc(60px + var(--safe-bottom));
            width: 100%; z-index: 500;
        }
        #map { width: 100%; height: 100%; }

        nav.bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: calc(60px + var(--safe-bottom));
            background: white; border-top: 1px solid #ddd; display: flex;
            justify-content: space-around; align-items: center; padding-bottom: var(--safe-bottom);
            z-index: 1100;
        }
        .nav-item { border: none; background: none; color: #8e8e93; font-size: 10px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--azul); }
        .nav-icon { font-size: 20px; }

        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 2000; align-items: flex-end; justify-content: center;
        }
        .modal-box {
            background: white; width: 100%; max-width: 500px; 
            padding: 20px 20px calc(25px + env(safe-area-inset-bottom));
            border-radius: 25px 25px 0 0; text-align: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2); animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        #modal-cat-tag { font-size: 10px; font-weight: 800; background: #f2f2f7; color: var(--azul); padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 12px; letter-spacing: 1px; }
        #modal-text { font-size: 18px; font-weight: 900; margin-bottom: 20px; line-height: 1.4; color: #000; }
        
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .m-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px; border-radius: 12px; border: none; font-weight: 800; font-size: 12px; color: white;
            text-decoration: none;
        }
        .btn-full { grid-column: span 2; }
        .btn-maps { background: var(--verde-maps); }
        .btn-waze { background: var(--waze-blue); }
        .btn-street { background: var(--street-view); }
        .btn-wa { background: var(--verde-wa); }
        .btn-close { background: transparent; color: #8e8e93; grid-column: span 2; margin-top: 5px; }

        .hidden { display: none !important; }

        /* Estilo para os pinos do mapa */
        .marker-urbano { filter: hue-rotate(0deg); }
        .marker-rural { filter: hue-rotate(140deg) brightness(1.2); }
    </style>
</head>
<body>

<header>
    <div class="logo-container"><img src="logo.png" alt="GUARDIÃ" class="logo-img"></div>
    <div class="search-area">
        <input type="text" id="searchBar" placeholder="BUSCAR POSTE OU RUA..." onkeyup="handleSearch()">
    </div>
    <div class="categories" id="cat-bar">
        <button class="pill active" onclick="filtrarCat('TUDO', this)">TUDO</button>
        <button class="pill" onclick="filtrarCat('CENTRO', this)">CENTRO</button>
        <button class="pill" onclick="filtrarCat('BAIRRO', this)">BAIRROS</button>
        <button class="pill" onclick="filtrarCat('TREVO', this)">TREVOS</button>
        <button class="pill" onclick="filtrarCat('RURAL', this)">RURAL</button>
        <button class="pill" onclick="filtrarCat('SAÍDA', this)">SAÍDAS</button>
    </div>
</header>

<div class="grid" id="mainGrid"></div>

<div id="map-container">
    <div id="map"></div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchView('grid', this)">
        <span class="nav-icon">📱</span> GRADE
    </button>
    <button class="nav-item" onclick="switchView('map', this)">
        <span class="nav-icon">🗺️</span> MAPA
    </button>
</nav>

<div id="modal" onclick="fechar()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="width: 40px; height: 5px; background: #e5e5ea; border-radius: 5px; margin: 0 auto 15px;"></div>
        <div id="modal-content-area"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const cameras = {
        // --- URBANAS ---
        1: {a: "PÇA DR CARLOS", l: "PCA DR CARLOS FRENTE MIN FAZENDA", c: "CENTRO", g: "-16.722728,-43.865195"},
        2: {a: "PÇA DR CARLOS", l: "PCA DR CARLOS FRENTE COPASA", c: "CENTRO", g: "-16.7233637,-43.8653465"},
        3: {a: "DR. SANTOS / PE. AUGUSTO", l: "RUA DR. SANTOS X RUA PE. AUGUSTO", c: "CENTRO", g: "-16.7240059,-43.8653894"},
        10: {a: "RUA SAO FRANC / GOV. VALADARES", l: "RUA SÃO FRANCISCO. X RUA GOV. VALADARES", c: "CENTRO", g: "-16.7228943,-43.8642814"},
        26: {a: "RUA SAO FRANC / FUNDO BRADESCO", l: "RUA SÃO FRANCISCO X RUA VISCONDE DE OURO PRETO", c: "CENTRO", g: "-16.72243590296203,-43.86421571530572"},
        63: {a: "SAIDA JURAMENTO", l: "SAIDA JURAMENTO", c: "SAÍDA", g: "-16.749509,-43.828515"},
        79: {a: "CEANORTE", l: "CEANORTE", c: "BAIRRO", g: "-16.757292, -43.847177"},
        // --- RURAIS ---
        80: {a: "EUROFARMA", l: "EUROFARMA", c: "RURAL", g: "-16.642387,-43.814704"},
        "89.1": {a: "S. PEDRO DA GARÇA", l: "SÃO PEDRO DA GARÇA (PONTO 1)", c: "RURAL", g: "-16.174354,-43.865721"},
        "100.1": {a: "NOVA ESPERANÇA", l: "NOVA ESPERANÇA (PONTO 1)", c: "RURAL", g: "-16.591795,-43.939539"}
    };

    let map, activeId = null;

    function getGroupedData() {
        const groups = {};
        Object.keys(cameras).forEach(id => {
            const baseId = id.split('.')[0];
            if (!groups[baseId]) groups[baseId] = [];
            groups[baseId].push({ id, ...cameras[id] });
        });
        return groups;
    }

    function render() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        const groups = getGroupedData();

        Object.keys(groups).sort((a,b) => parseFloat(a)-parseFloat(b)).forEach(baseId => {
            const items = groups[baseId];
            const isGroup = items.length > 1;
            const main = items[0];

            const btn = document.createElement('button');
            btn.className = `btn ${main.c === 'RURAL' ? 'btn-rural' : 'btn-urbano'}`;
            btn.onclick = () => isGroup ? showSubMenu(baseId) : ver(main.id);
            btn.innerHTML = `
                <span class="btn-num">${baseId}</span>
                <span class="btn-loc">${main.a}</span>
                ${isGroup ? `<span class="btn-group-tag">${items.length} PONTOS</span>` : ''}
            `;
            btn.dataset.loc = main.l;
            btn.dataset.cat = main.c;
            grid.appendChild(btn);
        });
    }

    function showSubMenu(baseId) {
        const items = getGroupedData()[baseId];
        let html = `<div style="font-weight:900; color:var(--azul); margin-bottom:15px;">GRUPO ${baseId} - SELECIONE O PONTO</div>`;
        html += `<div class="sub-points-list">`;
        items.forEach(item => {
            html += `<button class="sub-btn" onclick="ver('${item.id}')">
                        <span>PONTO ${item.id}</span>
                        <span style="font-size:10px; opacity:0.7;">➔</span>
                     </button>`;
        });
        html += `</div><button class="close-btn" onclick="fechar()" style="margin-top:20px; width:100%;">CANCELAR</button>`;
        document.getElementById('modal-content-area').innerHTML = html;
        document.getElementById('modal').style.display = "flex";
    }

    function ver(id) {
        activeId = id;
        const cam = cameras[id];
        const g = cam.g;
        let html = `
            <div id="modal-cat-tag">${cam.c}</div>
            <div id="modal-text">POSTE ${id}: ${cam.l}</div>
            <div class="action-buttons">
                <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${g}" class="m-btn btn-street btn-full" target="_blank">📸 VISÃO DA RUA (360º)</a>
                <a href="https://waze.com/ul?ll=${g}&navigate=yes" class="m-btn btn-waze" target="_blank">🚙 ROTA WAZE</a>
                <a href="https://www.google.com/maps/dir/?api=1&destination=${g}" class="m-btn btn-maps" target="_blank">🗺️ ROTA MAPS</a>
                <button class="m-btn btn-wa btn-full" onclick="shareAction('${id}')">💬 ENVIAR WHATSAPP</button>
                <button class="close-btn" onclick="fechar()">VOLTAR</button>
            </div>
        `;
        document.getElementById('modal-content-area').innerHTML = html;
        document.getElementById('modal').style.display = "flex";
        if(navigator.vibrate) navigator.vibrate(50);
    }

    function switchView(view, el) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        if(view === 'map') {
            document.getElementById('mainGrid').classList.add('hidden');
            document.getElementById('cat-bar').classList.add('hidden');
            document.getElementById('map-container').style.display = 'block';
            initMap();
        } else {
            document.getElementById('mainGrid').classList.remove('hidden');
            document.getElementById('cat-bar').classList.remove('hidden');
            document.getElementById('map-container').style.display = 'none';
        }
    }

    function initMap() {
        if (map) return;
        map = L.map('map').setView([-16.72, -43.86], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Ícones coloridos
        const blueIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });
        const orangeIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });

        Object.keys(cameras).forEach(id => {
            const cam = cameras[id];
            const [lat, lon] = cam.g.split(',').map(Number);
            const marker = L.marker([lat, lon], { icon: cam.c === 'RURAL' ? orangeIcon : blueIcon }).addTo(map);
            marker.bindPopup(`<b>POSTE ${id}</b><br>${cam.a}<br><button onclick="ver('${id}')" style="margin-top:5px; font-size:10px; padding:5px; border:none; background:var(--azul); color:white; border-radius:5px;">DETALHES</button>`);
        });
    }

    function shareAction(id) {
        const cam = cameras[id];
        const msg = `POSTE ${id}: ${cam.l}\n\n📍 LOCALIZAÇÃO: https://www.google.com/maps/search/?api=1&query=${cam.g}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function fechar() { document.getElementById('modal').style.display = "none"; }
    function handleSearch() {
        const t = document.getElementById('searchBar').value.toUpperCase();
        document.querySelectorAll('.btn').forEach(b => {
            const match = b.dataset.loc.toUpperCase().includes(t) || b.querySelector('.btn-num').innerText.includes(t);
            b.classList.toggle('hidden', !match);
        });
    }
    function filtrarCat(cat, el) {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        document.querySelectorAll('.btn').forEach(b => {
            b.classList.toggle('hidden', cat !== 'TUDO' && b.dataset.cat !== cat);
        });
    }

    render();
</script>
</body>
</html>
